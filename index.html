<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Random Emoji Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #0f172a;
            overflow: hidden; /* Prevent scrolling on mobile */
            touch-action: manipulation; /* Improves touch responsiveness */
        }

        :root {
            /* Base emoji sizes controlled here for the animation */
            --emoji-size: 160px; 
        }
        @media (min-width: 640px) {
            :root {
                --emoji-size: 220px;
            }
        }

        @keyframes pop-font {
            0% { font-size: calc(var(--emoji-size) * 0.3); opacity: 0; }
            60% { font-size: calc(var(--emoji-size) * 1.15); opacity: 1; }
            100% { font-size: var(--emoji-size); opacity: 1; }
        }

        .animate-pop {
            animation: pop-font 0.35s ease-out forwards;
        }

        /* Force high-quality emoji rendering */
        #emoji-display {
            font-family: "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            font-size: var(--emoji-size);
        }
    </style>
</head>
<body class="h-[100dvh] w-full flex flex-col relative bg-white overflow-hidden select-none cursor-pointer" onclick="handleScreenClick(event)">

    <!-- Generator View -->
    <main id="generator-view" class="flex flex-1 flex-col items-center justify-between w-full h-full z-10">
        
        <!-- Main Emoji Display: absolute centered so font-size animations don't shift layout -->
        <div class="flex-1 w-full h-full relative">
            <div id="emoji-display" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 leading-none select-none">
                <!-- Starts empty, waiting for the first tap -->
            </div>
        </div>

        <!-- Navigation Controls (Wide Back/Next) -->
        <div class="w-full flex h-24 sm:h-32 border-t border-gray-100 cursor-default bg-gray-50 shrink-0">
            <button id="btn-prev" onclick="goPrev(event)" class="w-1/2 flex justify-center items-center h-full active:bg-gray-200 disabled:opacity-20 disabled:active:bg-transparent transition-colors" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                </svg>
            </button>
            <div class="w-px bg-gray-200 h-full"></div>
            <button id="btn-next" onclick="goNext(event)" class="w-1/2 flex justify-center items-center h-full active:bg-gray-200 disabled:opacity-20 disabled:active:bg-transparent transition-colors" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                </svg>
            </button>
        </div>
    </main>

    <script>
        // Data Structure: Comprehensive list of standard emojis grouped by conceptual buckets
        const emojiDictionary = {
            'Smileys & Emotion': [ 
                '😴', '😷', '🤒', '🤢', '🤮', '🤧', '🥶', 
                '🥵', '🥱',
                '😈', '💩', '🤡', '👻', '👽', '🤖'
            ],
            'People & Body': [ 
                '✍️', '💅', 
                '👶', '🧑‍⚕️', '🧑‍🎓', '🧑‍🏫', '🧑‍⚖️', '🧑‍🌾', '🧑‍🍳', '🧑‍🔧', 
                '🧑‍🏭', '🧑‍💼', '🧑‍🔬', '🧑‍💻', '🧑‍🎨', '🧑‍✈️', '🧑‍🚀', '🧑‍🚒', '👮', 
                '🕵', '💂‍♂️', '🥷', '👷', '🤵', '👰', '🤰','🤱', '🧑‍🍼', '👼', '🎅', 
                '🦸', '🦹', '🧙‍♂️', '🧚‍♀️', '🧛', '🧜‍♀️', '🧞', '🧟', '💆', '💇', 
                '🚶', '🧍', '🧎', '🏃', '🧗','💃', '🕺',
                '🤺', '🏇', '⛷', '🏂', '🏌', '🏄', '🚣', '🏊', '⛹', '🏋', '🚴', 
                '🚵', '🤸', '🤽', '🤹', '🧘'
            ],
            'Animals & Nature': [
                '🐒', '🦍', '🐕', '🐺', '🦊', '🐈', '🦁', '🐅', 
                '🐆', '🐎', '🫎', '🦄', '🦓', '🦌', '🦬', '🐄', '🐖', 
                '🐑', '🐐', '🐪', '🦒', '🐘', '🦣', '🦏', 
                '🐁', '🐹', '🐇', '🐿', '🦫', '🦔', '🦇', '🐻', '🐨', '🐼', 
                '🦥', '🦨', '🦘', '🦃', '🐔', '🐧', '🕊', '🦅', 
                '🦆', '🦢', '🦉', '🦩', '🦚', '🦜', '🐸', '🐊', '🐢', '🦎', 
                '🐍', '🐉', '🦕', '🦖', '🐳', '🐬', '🦭', '🐟', '🐡', '🦈', 
                '🐙', '🐌', '🦋', '🐛', '🐜', '🐝', '🪲', '🐞', '🦗', '🕷', 
                '🦂', '🦟', '🪰', '🪱', '💐', '🌺', '🌻', 
                '🌼', '🌷', '🪳'
            ],
            'Food & Drink': [
                '🍇', '🍉', '🍋', '🍌', '🍎',  
                '🥕', '🌽', 
                '🍔', '🍟', 
                '🍕', '🌭', '🥪', '🥙', '🍲', 
                '🍿', '🧂', '🍝', 
                '🦀', '🦞', '🦐', '🦑', '🍦',  
                '🍪', '🎂', '🍫', '🍭', '🍯', '🍼', '☕', '🫖', 
                '🥤','🥣', '🍨'
            ],
            'Travel & Places': [
                '🌍', '🗺', '🌋',
                '🏗',
                '🎠', '🎡', '🎢', '🎪', 
                '🚂', '🚃', '🚌', '🚑', '🚒', '🚓', '🚕', '🚗', 
                '🚚', '🚜', '🏍', '🛵', '🚲', '🛴', '🛹', '🛼', 
                '🚨', '🚥', '🛑', '⛵', '🛶', 
                '✈️', '🪂', '🚁', '🚀', '🛸', '🛎', '🧳', '⏳', 
                '⌚', '⏰', '🌙', '🌡', '☀️', '⭐', '🌠', '⛈', '🌧', 
                '🌨', '🌪', '🌈', '☔', '⚡', '❄️', '⛄', '🔥', 
                '💧', '🌊','🪐'
            ],
            'Activities': [
                '🏆', '🏅',
                '⚽', '🏀', '🎾', '🥏', '🎳', 
                '🏓', '🥅', '⛸', '🎣', 
                '🎯', '🪀', '🪁', '🔫', '🪄', 
                '🧸', '🎨', '🧵', '🧶','🪆'
            ],
            'Objects': [
                '👑', '🎤', '🎷', '🪗', '🎸', '🎹', '🎺', '🎻', '🪕', '🥁', '📱', 
                '☎️', '🔌', '💻', '🪘', '🪈','🪇',
                '📺', '📷', '🔍', '🕯','🔦',
                '📖', '📚', '📰', '🪙', '💵', '💳','✉', 
                '✏', '✒', '✂️', '🗑', '🔐', '🔑', '🔨', '🗡', '⚔', 
                '🔫', '🪃', '🏹', '🛡', '🪚', '🪛', '⚖', 
                '🧲', '🪜', '🔬', '🔭', '📡', 
                '💉', '💊', '🩹', '🩺', '🚪', '🛗', '🪞', '🪟', 
                '🚽', '🚿', '🛁', '🪒', '🧴', '🧹', 
                '🧻', '🪣', '🧼', '🧽', '🛒', '🚬'
            ],
            'Symbols': [
                '💔', '❤️', '💋', '💥', '💦', '🕳️', '🚻'
            ]
        };
        
        // State variables
        let history = [];
        let currentIndex = -1;
        let usedEmojis = new Set(); // Tracks generated emojis to prevent duplicates

        // DOM Elements
        const emojiDisplay = document.getElementById('emoji-display');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        function generateNewEmoji() {
            // Determine the category to avoid (the one currently being viewed, if any)
            let avoidCategory = null;
            if (currentIndex >= 0 && currentIndex < history.length) {
                avoidCategory = history[currentIndex].category;
            }

            // Get all available categories
            const allCategories = Object.keys(emojiDictionary);
            
            // Filter out the avoided category and any categories where all emojis have been used
            let availableCategories = allCategories.filter(cat => {
                if (cat === avoidCategory) return false;
                return emojiDictionary[cat].some(emoji => !usedEmojis.has(emoji));
            });

            // If we run out of emojis, reset the session pool gracefully
            if (availableCategories.length === 0) {
                usedEmojis.clear();
                availableCategories = allCategories.filter(cat => cat !== avoidCategory);
            }
            
            // Select random category
            const randomCategory = availableCategories[Math.floor(Math.random() * availableCategories.length)];
            
            // Filter to only unused emojis in this category
            const unusedEmojisInCategory = emojiDictionary[randomCategory].filter(emoji => !usedEmojis.has(emoji));
            
            // Select random unused emoji
            const randomEmoji = unusedEmojisInCategory[Math.floor(Math.random() * unusedEmojisInCategory.length)];

            // Mark as used
            usedEmojis.add(randomEmoji);

            // Create new record
            const newRecord = {
                emoji: randomEmoji,
                category: randomCategory
            };

            // If we've gone back in time and generate a new one, we append it to the absolute end of the history.
            // This preserves the full timeline while allowing new generation.
            history.push(newRecord);
            
            // Jump to the newly created emoji at the end of the history
            currentIndex = history.length - 1;
            
            updateUI();
        }

        function handleScreenClick(event) {
            // Only generate new emoji if a button wasn't clicked
            if (event.target.closest('button')) return;
            generateNewEmoji();
        }

        function goPrev(event) {
            if (event) event.stopPropagation();
            if (currentIndex > 0) {
                currentIndex--;
                updateUI();
            }
        }

        function goNext(event) {
            if (event) event.stopPropagation();
            if (currentIndex < history.length - 1) {
                currentIndex++;
                updateUI();
            }
        }

        function updateUI() {
            const currentItem = history[currentIndex];

            // Trigger reflow to restart CSS animation
            emojiDisplay.classList.remove('animate-pop');
            void emojiDisplay.offsetWidth; // Force DOM reflow
            
            // Update content
            emojiDisplay.textContent = currentItem.emoji;
            
            // Add animation
            emojiDisplay.classList.add('animate-pop');

            // Update button states
            btnPrev.disabled = (currentIndex === 0);
            btnNext.disabled = (currentIndex === history.length - 1);
        }
    </script>
</body>
</html>
